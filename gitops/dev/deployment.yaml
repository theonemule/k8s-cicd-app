apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-dev
  labels:
    app: sample-app
    env: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-app
      env: dev
  template:
    metadata:
      labels:
        app: sample-app
        env: dev
    spec:
      containers:
      - name: app
        image: aksworkshopacr12345.azurecr.io/sample-app:main
        ports:
        - containerPort: 8080
        env:
        - name: ENVIRONMENT
          value: "development"
